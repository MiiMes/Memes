name: Deploy Frontend to GitHub Pages
run-name: ${{ github.ref_name == 'main' && '🚀 Production Deploy [main]' || '🛠️ Staging Deploy [develop]' }} (${{ github.sha }})

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          
      - run: npm ci
      
      - name: Verify provider secrets are configured
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_TENOR_CLIENT_KEY: ${{ secrets.VITE_TENOR_CLIENT_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        run: |
          test -n "$VITE_GIPHY_API_KEY" || { echo "Missing Actions secret: VITE_GIPHY_API_KEY" >&2; exit 1; }
          test -n "$VITE_TENOR_API_KEY" || { echo "Missing Actions secret: VITE_TENOR_API_KEY" >&2; exit 1; }
          test -n "$VITE_KLIPY_API_KEY" || { echo "Missing Actions secret: VITE_KLIPY_API_KEY" >&2; exit 1; }
          
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_BRANCH_NAME: ${{ github.ref_name }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_TENOR_CLIENT_KEY: ${{ secrets.VITE_TENOR_CLIENT_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
          
      - name: Generate Deployment Summary
        run: |
          echo "### 🌐 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | GitHub Pages (Live) |" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
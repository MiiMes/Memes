name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          
      - run: npm ci
      
      - name: Verify provider secrets are configured
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_TENOR_CLIENT_KEY: ${{ secrets.VITE_TENOR_CLIENT_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        run: |
          test -n "$VITE_GIPHY_API_KEY" || { echo "Missing Actions secret: VITE_GIPHY_API_KEY" >&2; exit 1; }
          test -n "$VITE_TENOR_API_KEY" || { echo "Missing Actions secret: VITE_TENOR_API_KEY" >&2; exit 1; }
          test -n "$VITE_KLIPY_API_KEY" || { echo "Missing Actions secret: VITE_KLIPY_API_KEY" >&2; exit 1; }
          
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_BRANCH_NAME: ${{ github.ref_name }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_TENOR_CLIENT_KEY: ${{ secrets.VITE_TENOR_CLIENT_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
          
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'main'
        with:
          path: dist

      - name: Save build artifact for develop branch
        uses: actions/upload-artifact@v4
        if: github.ref_name == 'develop'
        with:
          name: dist-dev
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Case A: Deploy main branch using native GitHub Pages deployment
      - name: Deploy to GitHub Pages (Main)
        if: github.ref_name == 'main'
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Case B: Deploy develop branch to gh-pages-dev branch
      - name: Download develop build artifact
        if: github.ref_name == 'develop'
        uses: actions/download-artifact@v4
        with:
          name: dist-dev
          path: dist

      - name: Deploy to Development Branch (gh-pages-dev)
        if: github.ref_name == 'develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages-dev